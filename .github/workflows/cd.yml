name: cd

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cafe-environments
  cancel-in-progress: false

jobs:
  ci:
    name: verificar
    uses: ./.github/workflows/ci.yml

  build:
    name: imagem-imutavel
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.artefato.outputs.image_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Preparar referência da imagem
        id: meta
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ÚNICO e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
      - name: Referência imutável por digest (staging = produção)
        id: artefato
        env:
          NAME: ${{ steps.meta.outputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  staging:
    if: ${{ vars.WATCHTOWER_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote.yml
    with:
      environment_name: staging
      image_ref: ${{ needs.build.outputs.image_ref }}
      expected_sha: ${{ github.sha }}

  production:
    if: ${{ vars.WATCHTOWER_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    needs: [build, staging]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote.yml
    with:
      environment_name: production
      image_ref: ${{ needs.build.outputs.image_ref }}
      expected_sha: ${{ github.sha }}

