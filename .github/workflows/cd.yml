name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cafe-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: verificar
    uses: ./.github/workflows/ci.yml

  build:
    name: imagem-imutavel
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.artefato.outputs.image_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar referência da imagem
        id: meta
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ÚNICO e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
      - name: Referência imutável por digest (staging = produção)
        id: artefato
        env:
          NAME: ${{ steps.meta.outputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"

  staging:
    name: implantar-staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Acionar deploy do mesmo digest no Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: curl --retry 3 --fail --silent --show-error -G "$HOOK" --data-urlencode "imgURL=$IMAGE"
      - name: Smoke test /health e /version
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$APP_URL/health" | grep -Fq '"ok"' \
              && curl -fsS --max-time 20 "$APP_URL/version" | grep -Fq "$EXPECTED_SHA"; then
              echo "Staging verificado com o SHA $EXPECTED_SHA"; exit 0
            fi
            sleep 15
          done
          echo "Staging não respondeu com a versão esperada"; exit 1

  production:
    name: aprovar-e-implantar-producao
    needs: [build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Acionar deploy do MESMO digest testado em staging
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: curl --retry 3 --fail --silent --show-error -G "$HOOK" --data-urlencode "imgURL=$IMAGE"
      - name: Smoke test em produção
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "$APP_URL/health" | grep -Fq '"ok"' \
              && curl -fsS --max-time 20 "$APP_URL/version" | grep -Fq "$EXPECTED_SHA"; then
              echo "Produção verificada com o SHA $EXPECTED_SHA"; exit 0
            fi
            sleep 15
          done
          echo "Produção não respondeu com a versão esperada"; exit 1
