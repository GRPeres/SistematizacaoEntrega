name: prepare-watchtower
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cafe-environments
  cancel-in-progress: false
jobs:
  initialize:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Seed missing channels with the already deployed baseline
        env:
          BASELINE: ghcr.io/grperes/sistematizacaoentrega@sha256:29be59e6f07b99ebc16e9379b4a22986b4b74751b1ae36c78d9a2474aa90e409
        shell: bash
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          for CHANNEL in staging production; do
            if docker buildx imagetools inspect "$NAME:$CHANNEL" >/dev/null 2>&1; then
              echo "$CHANNEL already exists; refusing to reset it"
              exit 1
            fi
          done
          bash scripts/promote_image.sh "$BASELINE" staging
          bash scripts/promote_image.sh "$BASELINE" production
