name: rollback
on:
  workflow_dispatch:
    inputs:
      tag:
        description: SHA of a previous known-good build (7 or 40 hex characters)
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: cafe-environments
  cancel-in-progress: false
jobs:
  rollback:
    if: ${{ github.ref == 'refs/heads/main' && vars.WATCHTOWER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve previous commit and published image digest
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          [[ "$TAG" =~ ^([a-f0-9]{7}|[a-f0-9]{40})$ ]] || exit 1
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          DIGEST="$(docker buildx imagetools inspect "$NAME:${SHA::7}" --format '{{.Manifest.Digest}}')"
          echo "EXPECTED_SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGE=$NAME@$DIGEST" >> "$GITHUB_ENV"
      - name: Restore the previous image without rebuilding
        run: bash scripts/promote_image.sh "$IMAGE" production
      - name: Verify recovery
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/wait_for_deployment.py
