name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: teste-ci
          POSTGRES_DB: cafe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cafe:teste-ci@localhost:5432/cafe_ci
      DESCONTO_MAXIMO: "50"
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes de API e regras com PostgreSQL; cobertura mínima 70%
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Auditoria de vulnerabilidades
        run: pip-audit -r requirements.txt
