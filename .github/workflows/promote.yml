name: promote
on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      image_ref:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote exact digest to environment channel
        env:
          IMAGE: ${{ inputs.image_ref }}
          CHANNEL: ${{ inputs.environment_name }}
        run: bash scripts/promote_image.sh "$IMAGE" "$CHANNEL"
      - name: Wait for Watchtower and verify public API
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/wait_for_deployment.py
